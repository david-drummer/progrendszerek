
services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:3000"
    environment:
      - PORT=3000
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGO_DB=bookdb
      - MONGO_USER=admin
      - MONGO_PASS=secret
    depends_on:
      - mongo

  mongo:
    image: mongo:6.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret
      MONGO_INITDB_DATABASE: bookdb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./server/docker-init:/docker-entrypoint-initdb.d:ro

volumes:
  mongo-data: