<section class="bookclub-detail" *ngIf="bookclub">
  <button mat-button class="back-button" (click)="goBack()">← Back</button>

  <h1>{{ bookclub.name }}</h1>
  <p class="description">{{ bookclub.description }}</p>

  <h2>Books</h2>

  <table mat-table [dataSource]="booksDataSource" class="books-table">

    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef>Title</th>
      <td mat-cell *matCellDef="let book">
        <a
          class="book-link"
          [routerLink]="[
            '/bookclubs',
            bookclub.id,
            'books',
            book.id,
            'ratings'
          ]"
        >
          {{ book.title }}
        </a>
      </td>
    </ng-container>

    <ng-container matColumnDef="author">
      <th mat-header-cell *matHeaderCellDef>Author</th>
      <td mat-cell *matCellDef="let book">{{ book.author }}</td>
    </ng-container>

    <ng-container matColumnDef="categoryId">
      <th mat-header-cell *matHeaderCellDef>Category</th>
      <td mat-cell *matCellDef="let book">{{ book.categoryId }}</td>
    </ng-container>

    <ng-container matColumnDef="publishedAt">
      <th mat-header-cell *matHeaderCellDef>Published</th>
      <td mat-cell *matCellDef="let book">
        {{ book.publishedAt | date:'yyyy-MM-dd' }}
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</section>
