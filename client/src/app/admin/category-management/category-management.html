<section class="category-management-page">
  <h1>Categories Management</h1>

  <div *ngIf="errorMessage" class="alert error">
    {{ errorMessage }}
  </div>

  <div *ngIf="successMessage" class="alert success">
    {{ successMessage }}
  </div>

  <div class="management-card">
    <h2>
      {{ editingCategory ? 'Edit Category' : 'Create New Category' }}
    </h2>

    <form class="category-form" (ngSubmit)="saveCategory()">
      <label>
        ID
        <input
          type="text"
          name="id"
          [(ngModel)]="form.id"
          [disabled]="!!editingCategory"
          placeholder="e.g., 5"
        />
      </label>

      <label>
        Name
        <input
          type="text"
          name="name"
          [(ngModel)]="form.name"
          required
          placeholder="e.g., Horror"
        />
      </label>

      <label>
        Description
        <textarea
          name="description"
          [(ngModel)]="form.description"
          required
          rows="4"
          placeholder="Brief description of the category"
        ></textarea>
      </label>

      <div class="form-actions">
        <button type="submit" class="primary-button">
          {{ editingCategory ? 'Save Changes' : 'Create Category' }}
        </button>

        <button
          *ngIf="editingCategory"
          type="button"
          class="secondary-button"
          (click)="cancelEdit()"
        >
          Cancel
        </button>
      </div>
    </form>
  </div>

  <div class="management-card">
    <h2>Existing Categories</h2>

    <div *ngIf="loading" class="message">
      Loading...
    </div>

    <div *ngIf="!loading && categories.length === 0" class="message">
      No categories to display.
    </div>

    <div class="category-table" *ngIf="!loading && categories.length > 0">
      <div class="table-header">
        <span>ID</span>
        <span>Name</span>
        <span>Description</span>
        <span>Actions</span>
      </div>

      <div class="table-row" *ngFor="let category of categories">
        <span>{{ category.id || category._id }}</span>
        <span>{{ category.name }}</span>
        <span>{{ category.description }}</span>

        <div class="row-actions">
          <button
            type="button"
            class="edit-button"
            (click)="editCategory(category)"
          >
            Edit
          </button>

          <button
            type="button"
            class="delete-button"
            (click)="deleteCategory(category)"
          >
            Delete
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
